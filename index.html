<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <!-- 設定文字編碼，避免中文顯示亂碼 -->
  <meta charset="UTF-8">

  <!-- 讓網頁能適應手機與不同螢幕尺寸 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 設定瀏覽器分頁標題 -->
  <title>我的個人網站</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- header：網頁的頁首區域 -->
  <header>
    <!-- h1：網頁最主要的標題 -->
    <h1>我的個人網站</h1>

    <!-- nav：放置網頁導覽連結 -->
    <nav>
      <!-- 連結到目前的首頁 -->
      <a href="index.html">首頁</a>

      <!-- 連結到同一個資料夾中的 about.html -->
      <a href="about.html">關於我</a>

      <!-- 連結到外部網站 -->
      <!-- target="_blank" 代表在新分頁開啟 -->
      <a
        href="https://www.tku.edu.tw/"
        target="_blank"
        rel="noreferrer"
      >
        淡江大學
      </a>
    </nav>
  </header>

  <!-- main：網頁的主要內容 -->
  <main>

    <!-- section：自我介紹區域 -->
    <section>
      <h2>自我介紹</h2>

      <!-- 插入圖片 -->
      <!-- src：圖片檔案的位置 -->
      <!-- alt：圖片無法顯示時的替代文字 -->
      <!-- width：設定圖片寬度 -->
      <img
        src="images/my_photo.jpg"
        alt="我的個人照片"
        width="200"
      >

      <!-- p：建立段落 -->
      <p>
        大家好，我是許妤婕，
        目前就讀於淡江大學資訊管理學系。
      </p>

      <!-- strong：表示重要或需要強調的文字 -->
      <!-- em：表示語氣上的強調文字 -->
      <p>
        我喜歡吃
        <strong>巧克力</strong>
        與
        <em>義大利麵</em>。
      </p>
    </section>

    <!-- section：興趣清單區域 -->
    <section>
      <h2>我的興趣</h2>

      <!-- ul：建立無序清單 -->
      <ul>
        <!-- li：清單中的一個項目 -->
        <li>追星</li>
        <li>旅遊</li>
        <li>購物</li>
      </ul>
    </section>

    <!-- section：學習步驟區域 -->
    <section>
      <h2>喜歡的卡通角色</h2>

      <!-- ol：建立有順序的清單 -->
      <ol>
        <li>布丁狗</li>
        <li>烏薩奇</li>
        <li>怕洽狗</li>
        <li>吉伊</li>
      </ol>
    </section>

    <!-- section：課程表格區域 -->
    <section>
      <h2>喜歡喝飲料</h2>

      <!-- table：建立表格 -->
      <table>
        <!-- caption：設定表格標題 -->
        <caption>常喝的手搖</caption>

        <!-- thead：表格的標題區域 -->
        <thead>
          <tr>
            <!-- th：表格標題欄位 -->
            <th scope="col">店名</th>
            <th scope="col">飲料名稱</th>
          </tr>
        </thead>

        <!-- tbody：表格的資料內容區域 -->
        <tbody>
          <!-- tr：建立一列表格資料 -->
          <tr>
            <!-- td：一般資料欄位 -->
            <td>龜記</td>
            <td>柳丁翡翠</td>
            <td>第一名</td>
          </tr>

          <tr>
            <td>清新福全</td>
            <td>隱藏版</td>
            <td>第二名</td>
          </tr>

          <tr>
            <td>上宇林</td>
            <td>太極鮮奶茶</td>
            <td>第三名</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- div：一般區塊容器，本身沒有特殊語意 -->
    <div>
      <h2>更多資訊</h2>

      <!-- 插入連結到 about.html -->
      <p>
        <a href="https://www.youtube.com/watch?v=oLwlM4g-2aw&list=RDoLwlM4g-2aw&start_radio=1">有小驚喜</a>
      </p>
    </div>
  </main>

  <!-- footer：網頁的頁尾區域 -->
  <footer>
    <p>© 2026 我的個人網站</p>
  </footer>
</body>

</html>
